[workspace]
members = [
    ".",
    "crates/vektordist-core",
    "crates/vektordist-proto",
    "crates/vektordist-cluster",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
ratatui = "0.29"
crossterm = "0.28"
vektordist-core = { path = "crates/vektordist-core" }
vektordist-proto = { path = "crates/vektordist-proto" }
vektordist-cluster = { path = "crates/vektordist-cluster" }

[package]
name = "vektordist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Laptop-first distributed sharded HNSW vector search engine with quorum WAL failover"

[dependencies]
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
vektordist-cluster.workspace = true
vektordist-core.workspace = true
vektordist-proto.workspace = true
