[workspace]
members = [
    ".",
    "crates/vektordist-core",
    "crates/vektordist-proto",
    "crates/vektordist-cluster",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/creova-gif/vektordist"

[workspace.dependencies]
thiserror = "2"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
prost = "0.13"
tonic-build = "0.12"
ratatui = "0.30"
crossterm = "0.29"
vektordist-core = { path = "crates/vektordist-core" }
vektordist-proto = { path = "crates/vektordist-proto" }
vektordist-cluster = { path = "crates/vektordist-cluster" }

[package]
name = "vektordist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Laptop-first distributed sharded HNSW vector search engine with quorum WAL failover"
keywords = ["vector-database", "hnsw", "distributed-systems", "simd", "rag"]
categories = ["database-implementations", "science", "command-line-utilities"]

[dependencies]
clap.workspace = true
crc32fast.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
vektordist-cluster.workspace = true
vektordist-core.workspace = true
vektordist-proto.workspace = true
