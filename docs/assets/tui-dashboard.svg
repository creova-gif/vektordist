<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-label="VektorDist v0.4.0 interactive cluster TUI dashboard showing 5 of 6 healthy nodes after SIGKILL failover and node-6 catch-up with zero lost writes and accessible status glyphs">
  <defs>
    <linearGradient id="termHeaderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'SFMono-Regular', 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
        font-variant-ligatures: none;
      }
      .title-text { fill: #8b949e; font-size: 12px; font-weight: 500; }
      .panel-title { fill: #58a6ff; font-size: 11.5px; font-weight: 700; }
      .fg { fill: #e6edf3; font-size: 11.2px; }
      .muted { fill: #8b949e; font-size: 11.2px; }
      .green { fill: #3fb950; font-weight: 700; }
      .red { fill: #f85149; font-weight: 700; }
      .cyan { fill: #39c5cf; }
      .cyan-bold { fill: #39c5cf; font-weight: 700; }
      .amber { fill: #d29922; font-weight: 700; }
      .badge-text { fill: #0d1117; font-size: 11.5px; font-weight: 800; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="0.5" y="0.5" width="979" height="539" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Terminal Title Bar -->
  <path d="M 1 10.5 Q 1 1 10.5 1 L 969.5 1 Q 979 1 979 10.5 L 979 36 L 1 36 Z" fill="url(#termHeaderGrad)"/>
  <line x1="1" y1="36" x2="979" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18.5" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18.5" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18.5" r="6" fill="#27c93f"/>
  <text x="490" y="23" text-anchor="middle" class="mono title-text">vektordist demo --nodes 5 --vectors 100000 --dimensions 768 --replication-factor 3 --seed 42</text>

  <!-- Panel 1: Cluster Summary Header Bar -->
  <rect x="14" y="46" width="952" height="44" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="24" y="40" width="118" height="14" fill="#161b22"/>
  <text x="28" y="50" class="mono panel-title">Cluster Summary</text>

  <rect x="26" y="59" width="136" height="20" rx="3" fill="#39c5cf"/>
  <text x="94" y="73" text-anchor="middle" class="mono badge-text">VEKTORDIST v0.4.0</text>
  <text x="170" y="73" class="mono fg" xml:space="preserve">| Nodes: <tspan class="fg" font-weight="700">5/6</tspan> | Vectors: <tspan class="fg" font-weight="700">104,820 (768d)</tspan> | RF=3 W=2 | Status: <tspan class="green">● HEALTHY</tspan></text>

  <!-- Panel 2 Left: Cluster Topology & Shards -->
  <rect x="14" y="100" width="522" height="244" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="24" y="94" width="186" height="14" fill="#0d1117"/>
  <text x="28" y="104" class="mono panel-title">Cluster Topology &amp; Shards</text>

  <text x="26" y="128" class="mono fg" xml:space="preserve"><tspan class="green">node-1 [● HEALTHY]</tspan> shards:  9 | vecs:  58,961 | 194.2 MiB | <tspan class="muted">127.0.0.1:54101</tspan></text>
  <text x="26" y="152" class="mono fg" xml:space="preserve"><tspan class="green">node-2 [● HEALTHY]</tspan> shards: 10 | vecs:  65,512 | 215.8 MiB | <tspan class="muted">127.0.0.1:54102</tspan></text>
  <text x="26" y="176" class="mono fg" xml:space="preserve"><tspan class="green">node-3 [● HEALTHY]</tspan> shards: 10 | vecs:  65,513 | 215.8 MiB | <tspan class="muted">127.0.0.1:54103</tspan></text>
  <text x="26" y="200" class="mono fg" xml:space="preserve"><tspan class="green">node-4 [● HEALTHY]</tspan> shards: 10 | vecs:  65,512 | 215.8 MiB | <tspan class="muted">127.0.0.1:54104</tspan></text>
  <text x="26" y="224" class="mono fg" xml:space="preserve"><tspan class="red">node-5 [✕ DEAD]   </tspan> shards:  0 | vecs:       0 |   0.0 MiB | <tspan class="muted">127.0.0.1:54105</tspan></text>
  <text x="26" y="248" class="mono fg" xml:space="preserve"><tspan class="green">node-6 [● HEALTHY]</tspan> shards:  9 | vecs:  58,962 | 194.2 MiB | <tspan class="muted">127.0.0.1:54106</tspan></text>

  <line x1="26" y1="296" x2="524" y2="296" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="316" class="mono fg" xml:space="preserve">Shards: <tspan class="green">16 Healthy</tspan> | <tspan class="cyan-bold">0 Recovering</tspan> | <tspan class="fg" font-weight="700">0 UnderQuorum</tspan></text>
  <text x="26" y="333" class="mono muted" xml:space="preserve">Ring: 16 SplitMix64 partitions x RF=3 (48 active shard replicas)</text>

  <!-- Panel 2 Right: Live Telemetry -->
  <rect x="546" y="100" width="420" height="244" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="556" y="94" width="114" height="14" fill="#0d1117"/>
  <text x="560" y="104" class="mono panel-title">Live Telemetry</text>

  <text x="558" y="130" class="mono fg" xml:space="preserve">Recall@10:           <tspan class="green">99.60%</tspan> <tspan class="muted">(target &gt;= 95.0%)</tspan></text>
  <text x="558" y="156" class="mono fg" xml:space="preserve">Search Latency p50:  <tspan class="cyan-bold">1.42 ms</tspan> | p95: <tspan class="cyan-bold">3.18 ms</tspan> <tspan class="muted">(&lt;=50ms)</tspan></text>
  <text x="558" y="182" class="mono fg" xml:space="preserve">Search Latency p99:  <tspan class="cyan-bold">4.85 ms</tspan> | Throughput: <tspan class="fg" font-weight="700">384.2 QPS</tspan></text>
  <text x="558" y="208" class="mono fg" xml:space="preserve">Acknowledged Writes: <tspan class="fg" font-weight="700">104,820</tspan> | Lost: <tspan class="green">0</tspan></text>
  <text x="558" y="234" class="mono fg" xml:space="preserve">Last Failover Time:  <tspan class="green">42.6 ms</tspan> <tspan class="muted">(&lt;=5000ms)</tspan></text>
  <text x="558" y="260" class="mono fg" xml:space="preserve">Gateway: <tspan class="cyan">http://127.0.0.1:54120/metrics</tspan></text>

  <line x1="558" y1="296" x2="954" y2="296" stroke="#21262d" stroke-width="1"/>
  <text x="558" y="320" class="mono fg" xml:space="preserve">p95 Sparkline: <tspan class="cyan-bold" font-size="13">▂▃▂▄▃▂▅▃▂▂▃▂</tspan> <tspan class="muted">(adaptive ef=64)</tspan></text>

  <!-- Panel 3: Cluster Event Log -->
  <rect x="14" y="354" width="952" height="122" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="24" y="348" width="238" height="14" fill="#0d1117"/>
  <text x="28" y="358" class="mono panel-title">Cluster Event Log (newest first)</text>

  <text x="26" y="381" class="mono fg" xml:space="preserve"><tspan class="green">[RECOVERY]</tspan> Added node-6; caught up 9 shards (RECOVERING -&gt; HEALTHY, acked_writes_lost=0)</text>
  <text x="26" y="405" class="mono fg" xml:space="preserve"><tspan class="amber">[FAILOVER]</tspan> Killed node-5 (SIGKILL); recovered in 42.6ms, acked_writes_lost=0</text>
  <text x="26" y="429" class="mono fg" xml:space="preserve"><tspan class="cyan-bold">[LOAD]    </tspan> 10 search clients + continuous W=2 quorum writer active.</text>
  <text x="26" y="453" class="mono muted" xml:space="preserve">[OK]       5 nodes healthy; 100,000 vectors indexed (seed=42, RF=3, W=2).</text>

  <!-- Panel 4: Interactive Keybindings Footer -->
  <rect x="14" y="486" width="952" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="26" y="510" class="mono cyan" xml:space="preserve">Keys: <tspan class="cyan-bold">[k]</tspan> Kill node   <tspan class="cyan-bold">[a]</tspan> Add replacement   <tspan class="cyan-bold">[p]</tspan> Pause/Resume   <tspan class="cyan-bold">[r]</tspan> Reset   <tspan class="cyan-bold">[?]</tspan> Help   <tspan class="cyan-bold">[q]</tspan> Quit</text>
</svg>
