name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: vektordist-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_name: vektordist-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_name: vektordist-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin vektordist

      - name: Package tarball and SHA256 checksum
        run: |
          mkdir -p dist/${{ matrix.archive_name }}
          cp target/${{ matrix.target }}/release/vektordist dist/${{ matrix.archive_name }}/
          cp README.md LICENSE CHANGELOG.md dist/${{ matrix.archive_name }}/
          tar -C dist -czf dist/${{ matrix.archive_name }}.tar.gz ${{ matrix.archive_name }}
          cd dist
          shasum -a 256 ${{ matrix.archive_name }}.tar.gz > ${{ matrix.archive_name }}.tar.gz.sha256

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.archive_name }}.tar.gz
            dist/${{ matrix.archive_name }}.tar.gz.sha256
