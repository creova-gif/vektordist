global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: vektordist-local

scrape_configs:
  - job_name: vektordist-gateway
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
        labels:
          service: vektordist-gateway
          component: gateway
