apiVersion: v1
kind: Service
metadata:
  name: vektordist-nodes
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "0.2.0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vektordist-node
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "0.2.0"
spec:
  serviceName: vektordist-nodes
  replicas: 5
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vektordist
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vektordist
        app.kubernetes.io/component: node
        app.kubernetes.io/version: "0.2.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vektordist
                  app.kubernetes.io/component: node
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vektordist
                    app.kubernetes.io/component: node
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: vektordist-node
          image: ghcr.io/creova-gif/vektordist:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/bin/vektordist
            - node
            - --id
            - "1"
            - --listen
            - 0.0.0.0:50052
            - --data-dir
            - /var/lib/vektordist/data
            - --dimensions
            - "768"
            - --num-shards
            - "16"
            - --write-quorum
            - "2"
          env:
            - name: VEKTORDIST_COORD_ADDR
              value: "http://vektordist-coord:50051"
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: wal-data
              mountPath: /var/lib/vektordist/data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: wal-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: premium-rwo
        resources:
          requests:
            storage: 100Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vektordist-node-pdb
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "0.2.0"
spec:
  # Preserve >= 4 of 5 replica nodes so every RF=3 shard maintains >= 2 healthy
  # replicas (W=2 write quorum) across voluntary node drains and rolling upgrades.
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: vektordist
      app.kubernetes.io/component: node
---
apiVersion: v1
kind: Service
metadata:
  name: vektordist-coord
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: coord
    app.kubernetes.io/version: "0.2.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: coord
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vektordist-coord
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: coord
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vektordist
      app.kubernetes.io/component: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vektordist
        app.kubernetes.io/component: coord
        app.kubernetes.io/version: "0.2.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vektordist-coord
          image: ghcr.io/creova-gif/vektordist:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/bin/vektordist
            - coord
            - --listen
            - 0.0.0.0:50051
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vektordist-gateway
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.2.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vektordist-gateway
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vektordist
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vektordist
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vektordist
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vektordist
                    app.kubernetes.io/component: gateway
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: vektordist-gateway
          image: ghcr.io/creova-gif/vektordist:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/bin/vektordist
            - gateway
            - --coord
            - http://vektordist-coord:50051
            - --listen
            - 0.0.0.0:8080
          env:
            - name: VEKTORDIST_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: vektordist-auth-secret
                  key: master-secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vektordist-gateway-pdb
  labels:
    app.kubernetes.io/name: vektordist
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.2.0"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vektordist
      app.kubernetes.io/component: gateway
